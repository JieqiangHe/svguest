name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the inline scripts of both pages
        run: |
          node -e '
          const fs=require("fs");let bad=0;
          for(const f of ["index.html","app.html"]){const s=fs.readFileSync(f,"utf8");let n=0;
            for(const m of s.matchAll(/<script>([\s\S]*?)<\/script>/g)){n++;try{new Function(m[1])}catch(e){bad=1;console.log(`::error file=${f}::script ${n}: ${e.message}`)}}
            if(!n){bad=1;console.log(`::error file=${f}::no inline script found`)}
            console.log(`${f}: ${n} scripts checked`)}
          process.exit(bad)'

      - name: Collect the site
        run: |
          mkdir _site
          cp index.html app.html svguest.plugin LICENSE _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
